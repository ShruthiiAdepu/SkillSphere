<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload</title>
    <link rel="stylesheet" href="fifth.css">
</head>
<body>
    <div class="upload-container">
        <form action="upload.php" method="post" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="fileInput" class="file-input" required />
            <label for="fileInput" class="file-label">
                <img src="image 7.svg" alt="Upload Icon" />
                <br />
                <img src="Upload Here.svg" alt="Upload" class="upload-image" />
            </label>

            <h2>Create</h2>
            <div class="input-container">
                <input type="text" name="caption" placeholder="caption" class="input-field" required />
                <br /><br />
                <input type="text" name="link" placeholder="links" class="input-field" required />
            </div>
            <br />
                <!-- <a href="profile.html" class="button">DONE</a> -->
                <input type="submit" value="DONE" class="button" />

        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
